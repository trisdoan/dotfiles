onboarding = false

[ui.sound]
enabled = false

[theme]
name = "catppuccin"
auto_switch = false

[ui.toast]
delivery = "system"

[ui.toast.clipboard]
enabled=false

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_sort = "priority"
[experimental]
pane_history = false


[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "open file viewer in split"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "open file viewer in tab"
