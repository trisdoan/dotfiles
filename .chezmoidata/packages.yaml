packages:
  # Arch/Omarchy: tmux, starship, fzf, eza, bat, ripgrep, fd, lazygit and
  # lazydocker already ship in omarchy-base.packages.
  pacman:
    - neovim
    - ghostty
    - git-delta
    - ttf-fira-code
