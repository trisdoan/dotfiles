packages:
  # Arch/Omarchy: tmux, starship, fzf, eza, bat, ripgrep, fd, lazygit,
  # lazydocker and neovim (via omarchy-nvim's dependency) already ship in
  # omarchy-base.packages.
  pacman:
    - ghostty
    - git-delta
    - ttf-fira-code
    - flatpak

  # No Omarchy command wraps flatpak, and slack-desktop is in neither the
  # pacman repos nor the AUR.
  flatpak:
    - com.slack.Slack
